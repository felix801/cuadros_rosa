<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="graphiteBg" cx="45%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#24252a"/>
      <stop offset="65%" stop-color="#18191c"/>
      <stop offset="100%" stop-color="#0f1012"/>
    </radialGradient>
    <filter id="graphiteShade">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="noise"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.9 0 0 0 0 0.9 0 0 0 0 0.95 0 0 0 0.08 0" in="noise" result="coloredNoise"/>
      <feBlend mode="overlay" in="SourceGraphic" in2="coloredNoise"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#graphiteBg)"/>

  <!-- Estudio anatómico de manos a lápiz grafito y difumino -->
  <g filter="url(#graphiteShade)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Manos entrelazadas en gesto sereno -->
    <!-- Mano base / muñeca izquierda -->
    <path d="M 180 680 C 220 580, 260 520, 310 460 C 330 435, 360 410, 400 390" fill="none" stroke="#cfd6df" stroke-width="3" opacity="0.85"/>
    <path d="M 230 720 C 270 630, 310 570, 370 510" fill="none" stroke="#cfd6df" stroke-width="2.5" opacity="0.75"/>

    <!-- Volumen y sombreado difuminado muñeca -->
    <path d="M 220 620 Q 280 560 340 500 Q 360 540 290 650 Z" fill="#202227" opacity="0.7"/>
    <g opacity="0.4" stroke="#a0abbd" stroke-width="0.75">
      <line x1="250" y1="590" x2="310" y2="550"/>
      <line x1="260" y1="605" x2="320" y2="565"/>
      <line x1="270" y1="620" x2="330" y2="580"/>
    </g>

    <!-- Dedos mano izquierda -->
    <!-- Pulgar -->
    <path d="M 340 460 C 370 430, 400 380, 410 330 C 412 310, 405 300, 395 305 C 380 315, 365 350, 345 400" fill="#1d1e22" stroke="#e1e7f0" stroke-width="2.2" opacity="0.9"/>
    
    <!-- Índice -->
    <path d="M 380 400 C 410 360, 470 270, 495 210 C 505 190, 490 180, 480 195 C 450 240, 410 320, 385 380" fill="#22242b" stroke="#e8edf5" stroke-width="2.2" opacity="0.92"/>
    <line x1="475" y1="230" x2="490" y2="220" stroke="#b0bece" stroke-width="1.2" opacity="0.7"/>

    <!-- Corazón -->
    <path d="M 405 420 C 440 370, 520 260, 550 190 C 560 170, 545 160, 530 180 C 495 230, 440 330, 415 400" fill="#252830" stroke="#f0f4fa" stroke-width="2.4" opacity="0.95"/>
    
    <!-- Anular y meñique -->
    <path d="M 425 450 C 460 410, 530 330, 555 270 C 565 255, 550 245, 540 260 C 505 310, 455 390, 430 440" fill="#20232a" stroke="#dbe2ed" stroke-width="2" opacity="0.88"/>
    <path d="M 440 480 C 470 450, 525 390, 545 350 C 555 335, 540 330, 530 340 C 500 380, 460 440, 440 475" fill="#1c1e23" stroke="#cbd4e0" stroke-width="1.8" opacity="0.85"/>

    <!-- Mano derecha envolvente (claroscuro) -->
    <path d="M 330 460 C 370 510, 440 540, 520 530 C 560 525, 610 490, 640 440" fill="none" stroke="#cfd6df" stroke-width="2.5" opacity="0.8"/>
    <path d="M 440 540 C 480 570, 540 575, 600 540 C 630 520, 660 480, 680 430" fill="none" stroke="#a0abbd" stroke-width="1.8" opacity="0.6"/>

    <!-- Sombras cruzadas grafito (Cross-hatching detallado) -->
    <g opacity="0.55" stroke="#edf2f9" stroke-width="0.6">
      <line x1="410" y1="430" x2="445" y2="415"/>
      <line x1="415" y1="440" x2="450" y2="425"/>
      <line x1="420" y1="450" x2="455" y2="435"/>
      <line x1="425" y1="460" x2="460" y2="445"/>

      <!-- Trazos opuestos de cruce -->
      <line x1="415" y1="415" x2="445" y2="445"/>
      <line x1="425" y1="420" x2="455" y2="450"/>
      <line x1="435" y1="425" x2="465" y2="455"/>
    </g>

    <!-- Líneas de estudio y construcción geométrica -->
    <g stroke="#d4af37" stroke-width="0.8" opacity="0.3" stroke-dasharray="4,6">
      <line x1="150" y1="700" x2="570" y2="160"/>
      <line x1="300" y1="300" x2="680" y2="450"/>
      <circle cx="460" cy="380" r="140" fill="none"/>
    </g>
  </g>

  <!-- Firma -->
  <text x="680" y="750" font-family="'Cinzel', serif" font-size="14" fill="#d4af37" letter-spacing="3" opacity="0.75">ROSA MARTÍN</text>
  <text x="680" y="768" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#a0abbd" letter-spacing="1.5" opacity="0.6">GRAFITO Y DIFUMINO</text>
</svg>
