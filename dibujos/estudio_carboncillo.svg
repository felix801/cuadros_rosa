<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="paperBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2a2723"/>
      <stop offset="60%" stop-color="#1c1a17"/>
      <stop offset="100%" stop-color="#12110f"/>
    </radialGradient>
    <filter id="charcoalGrain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" result="noise"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.8  0 0 0 0 0.75  0 0 0 0 0.65  0 0 0 0.07 0" in="noise" result="coloredNoise"/>
      <feBlend mode="multiply" in="SourceGraphic" in2="coloredNoise"/>
    </filter>
  </defs>

  <!-- Papel verjurado fondo -->
  <rect width="800" height="800" fill="url(#paperBg)"/>
  
  <!-- Textura sutil de líneas de papel -->
  <g stroke="#3a3630" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="100" x2="800" y2="100"/><line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/><line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="500" x2="800" y2="500"/><line x1="0" y1="600" x2="800" y2="600"/>
    <line x1="0" y1="700" x2="800" y2="700"/>
  </g>

  <!-- Trazos de carboncillo botánico -->
  <g filter="url(#charcoalGrain)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Tallo principal -->
    <path d="M 400 720 Q 390 550 410 400 T 380 180" fill="none" stroke="#dcd6cd" stroke-width="4.5" opacity="0.85"/>
    <path d="M 402 720 Q 392 550 412 400 T 382 180" fill="none" stroke="#221e1a" stroke-width="2" opacity="0.6"/>
    
    <!-- Ramas laterales -->
    <path d="M 405 520 Q 480 470 540 420" fill="none" stroke="#d5cebe" stroke-width="3" opacity="0.8"/>
    <path d="M 400 440 Q 320 380 270 330" fill="none" stroke="#d5cebe" stroke-width="3" opacity="0.8"/>
    <path d="M 395 320 Q 470 260 520 200" fill="none" stroke="#d5cebe" stroke-width="2.5" opacity="0.75"/>
    <path d="M 388 240 Q 330 190 290 140" fill="none" stroke="#d5cebe" stroke-width="2" opacity="0.75"/>

    <!-- Hojas con claroscuro y difuminado -->
    <!-- Hoja 1 Derecha -->
    <path d="M 405 520 C 470 480, 560 480, 600 410 C 550 430, 480 470, 405 520 Z" fill="#201d19" stroke="#e8e2d5" stroke-width="1.8" opacity="0.9"/>
    <!-- Nervios hoja 1 -->
    <path d="M 430 500 Q 500 460 570 420" fill="none" stroke="#e8e2d5" stroke-width="1" opacity="0.6"/>
    <path d="M 470 480 Q 500 460 520 440" fill="none" stroke="#e8e2d5" stroke-width="0.8" opacity="0.5"/>
    <path d="M 510 455 Q 540 440 560 430" fill="none" stroke="#e8e2d5" stroke-width="0.8" opacity="0.5"/>

    <!-- Hoja 2 Izquierda -->
    <path d="M 400 440 C 330 400, 240 390, 200 320 C 250 345, 330 390, 400 440 Z" fill="#1b1815" stroke="#f0ebe1" stroke-width="2" opacity="0.92"/>
    <path d="M 370 420 Q 300 375 230 335" fill="none" stroke="#f0ebe1" stroke-width="1" opacity="0.65"/>
    <path d="M 340 400 Q 300 380 280 355" fill="none" stroke="#f0ebe1" stroke-width="0.8" opacity="0.5"/>

    <!-- Flor / Capullo en cénit -->
    <g transform="translate(380, 180)">
      <path d="M 0 0 C -30 -40, -50 -90, -20 -130 C 0 -100, 20 -70, 0 0 Z" fill="#24211c" stroke="#f3efe6" stroke-width="2" opacity="0.9"/>
      <path d="M 0 0 C 30 -40, 50 -90, 20 -130 C 0 -100, -20 -70, 0 0 Z" fill="#1e1b17" stroke="#e2dcd0" stroke-width="1.8" opacity="0.85"/>
      <path d="M -15 -30 C -10 -80, 10 -110, 0 -140 C 10 -90, -5 -50, -15 -30 Z" fill="#2e2923" stroke="#ffffff" stroke-width="2.2" opacity="0.95"/>
      <!-- Sombreado a rayas / crosshatch -->
      <line x1="-15" y1="-50" x2="5" y2="-60" stroke="#f5f2ea" stroke-width="0.75" opacity="0.7"/>
      <line x1="-18" y1="-65" x2="10" y2="-75" stroke="#f5f2ea" stroke-width="0.75" opacity="0.7"/>
      <line x1="-12" y1="-80" x2="12" y2="-90" stroke="#f5f2ea" stroke-width="0.75" opacity="0.7"/>
      <line x1="-8" y1="-95" x2="8" y2="-105" stroke="#f5f2ea" stroke-width="0.75" opacity="0.7"/>
    </g>

    <!-- Sombreados expresivos en el fondo -->
    <g opacity="0.35" stroke="#ffffff" stroke-width="0.7">
      <line x1="320" y1="580" x2="420" y2="520"/>
      <line x1="330" y1="595" x2="430" y2="535"/>
      <line x1="340" y1="610" x2="440" y2="550"/>
      <line x1="350" y1="625" x2="450" y2="565"/>
    </g>
  </g>

  <!-- Firma artística sutil -->
  <text x="680" y="750" font-family="'Cinzel', serif" font-size="14" fill="#d4af37" letter-spacing="3" opacity="0.75">ROSA MARTÍN</text>
  <text x="680" y="768" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#a09885" letter-spacing="1.5" opacity="0.6">CARBONCILLO</text>
</svg>
